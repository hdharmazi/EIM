trigger:
- main
variables:
  APP_NAME: azf-eim-customer-wtc-test
  APP_TYPE: functionAppLinux
  AZURE_PACKAGE_PATH: published
  AZURE_RESOURCE_GROUP: d365fsc-integration-nonprod
  AZURE_SUBSCRIPTION: <Replace with Azure Dev Ops Service Connection String>
  CONFIGURATION: Release
  DEPLOY_DISPLAY_NAME: Deploy 'azf-eim-customer-wtc-test' to Azure Function App
  DOTNET_CORE_VERSION: 10.0.x
  WORKING_DIRECTORY: ARM.Integration.EIM.Customer
pool:
  vmImage: windows-latest
stages:
- stage: Build
  displayName: Build Stage
  jobs:
  - job: Build
    displayName: Build Job
    steps:
    - checkout: self
    - task: UseDotNet@2
      displayName: Use .NET SDK
      inputs:
        packageType: sdk
        version: $(DOTNET_CORE_VERSION)
    - task: DotNetCoreCLI@2
      displayName: Restore
      inputs:
        command: restore
        projects: $(WORKING_DIRECTORY)\*.csproj
    - task: DotNetCoreCLI@2
      displayName: Build
      inputs:
        command: build
        projects: $(WORKING_DIRECTORY)\*.csproj
        arguments: --configuration $(CONFIGURATION)
    - task: DotNetCoreCLI@2
      displayName: Publish
      inputs:
        command: publish
        publishWebProjects: false
        projects: $(WORKING_DIRECTORY)\*.csproj
        arguments: --configuration $(CONFIGURATION) --output $(AZURE_PACKAGE_PATH)
        zipAfterPublish: true
    - task: PublishBuildArtifacts@1
      displayName: Drop
      inputs:
        PathtoPublish: $(AZURE_PACKAGE_PATH)
        ArtifactName: drop
        publishLocation: Container
- stage: Deploy
  displayName: Deploy Stage
  jobs:
  - job: Deploy
    displayName: Deploy Job
    steps:
    - download: current
      artifact: drop
    - task: AzureFunctionApp@1
      displayName: $(DEPLOY_DISPLAY_NAME)
      inputs:
        azureSubscription: $(AZURE_SUBSCRIPTION)
        appType: $(APP_TYPE)
        appName: $(APP_NAME)
        package: $(Pipeline.Workspace)\drop\*.zip
        resourceGroupName: $(AZURE_RESOURCE_GROUP)
