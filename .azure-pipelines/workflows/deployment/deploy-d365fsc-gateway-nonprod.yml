# Manual, code-only deployment of the shared non-production D365 F&SC Gateway.
trigger: none
pr: none

pool:
  vmImage: windows-latest

variables:
  DOTNET_VERSION: 10.0.x
  CONFIGURATION: Release
  GATEWAY_PROJECT: ARM.Integration.D365FSC.Gateway/ARM.Integration.D365FSC.Gateway.csproj
  TEST_PROJECT: ARM.Integration.D365FSC.Gateway.Tests/ARM.Integration.D365FSC.Gateway.Tests.csproj
  ARTIFACT_NAME: d365fsc-gateway
  PACKAGE_FILE: d365fsc-gateway-$(Build.BuildId).zip
  GATEWAY_APP_NAME: azf-d365fsc-gateway-wtc-nonprod
  RESOURCE_GROUP: d365fsc-integration-nonprod

stages:
  - stage: Build
    displayName: Build and package shared nonprod Gateway
    jobs:
      - job: Build
        steps:
          - checkout: self

          - task: UseDotNet@2
            displayName: Use .NET SDK $(DOTNET_VERSION)
            inputs:
              packageType: sdk
              version: $(DOTNET_VERSION)

          - task: DotNetCoreCLI@2
            displayName: Restore Gateway project
            inputs:
              command: restore
              projects: $(GATEWAY_PROJECT)

          - task: DotNetCoreCLI@2
            displayName: Run Gateway tests
            inputs:
              command: test
              projects: $(TEST_PROJECT)
              arguments: --configuration $(CONFIGURATION)

          - task: DotNetCoreCLI@2
            displayName: Publish Gateway
            inputs:
              command: publish
              publishWebProjects: false
              projects: $(GATEWAY_PROJECT)
              arguments: --configuration $(CONFIGURATION) --output $(Build.ArtifactStagingDirectory)/gateway-publish --no-restore
              zipAfterPublish: false
              modifyOutputPath: false

          - task: ArchiveFiles@2
            displayName: Package Gateway ZIP
            inputs:
              rootFolderOrFile: $(Build.ArtifactStagingDirectory)/gateway-publish
              includeRootFolder: false
              archiveType: zip
              archiveFile: $(Build.ArtifactStagingDirectory)/$(PACKAGE_FILE)
              replaceExistingArchive: true

          - task: PublishPipelineArtifact@1
            displayName: Publish Gateway artifact
            inputs:
              targetPath: $(Build.ArtifactStagingDirectory)/$(PACKAGE_FILE)
              artifact: $(ARTIFACT_NAME)

  - stage: DeployNonprod
    displayName: Deploy shared nonprod Gateway
    dependsOn: Build
    jobs:
      - deployment: DeployGateway
        displayName: Deploy shared nonprod Gateway
        environment: d365fsc-gateway-nonprod
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self

                - download: current
                  artifact: $(ARTIFACT_NAME)

                - task: AzureCLI@2
                  displayName: ZIP deploy $(GATEWAY_APP_NAME)
                  inputs:
                    azureSubscription: $(NONPROD_AZURE_SERVICE_CONNECTION)
                    scriptType: pscore
                    scriptLocation: inlineScript
                    inlineScript: |
                      az functionapp deployment source config-zip `
                        --resource-group "$(RESOURCE_GROUP)" `
                        --name "$(GATEWAY_APP_NAME)" `
                        --src "$(Pipeline.Workspace)/$(ARTIFACT_NAME)/$(PACKAGE_FILE)"
                      if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
