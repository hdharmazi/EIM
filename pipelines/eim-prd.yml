# Wilson EIM production: promotes the package of an eim run (pipelines/eim.yml) to the isolated production
# configuration prd. Builds nothing: the binaries are the ones eim already deployed to bat and test. On a manual run,
# pick the eim run under Resources; it must be a run from main whose Deploy_test stage succeeded
# (docs/deployment/production-go-live.md).
#
# One-time setup (docs/deployment/devops-setup.md):
#   - Azure DevOps environment: eim-wtc-prd (production approvers + exclusive lock)
#   - ARM service connection 'sc-eim-wtc-prd' (workload identity, Contributor on d365fsc-integration-prod only,
#     authorised for this pipeline only). Its service principal must be a member of the production SQL server's
#     Entra admin group for migrations and database access.
#   - Library variable group 'eim-wtc-prd': only the optional EIM_DEPLOY_CONFIG_OVERRIDES, restricted to this
#     pipeline. There are no deployment secrets.
# prd owns all of its resources. Infrastructure, app settings, migrations and database access run only when ticked;
# the eim-wtc-prd approval gates every one of them.

parameters:
  - name: deployInfra
    displayName: Infrastructure (plan, apps, storage, Insights, queues, SQL)
    type: boolean
    default: false
  - name: applySettings
    displayName: Apply app settings
    type: boolean
    default: false
  - name: runMigrations
    displayName: Run database migrations
    type: boolean
    default: false
  - name: grantDatabaseAccess
    displayName: Grant database access to the apps (sqlusers)
    type: boolean
    default: false
  - name: deployCode
    displayName: Deploy code (gateway, dashboard, Automation)
    type: boolean
    default: true

name: eim-prd-$(Date:yyyyMMdd)$(Rev:.r)

# Manual runs only: never on a push, a pull request or an eim run.
trigger: none
pr: none

resources:
  pipelines:
    # The default run offered at queue time is the latest eim run from main; pull request and feature runs publish
    # a package too, and must not become the production default.
    - pipeline: eim
      source: eim
      branch: main
      trigger: none

# A newer run waiting at an environment replaces an older one that was never approved.
lockBehavior: runLatest

stages:
  # Production owns its Service Bus namespace, Key Vault, SQL server and database, plan, gateway, dashboard API and
  # SPA, and Automation app. It shares nothing with bat or test.
  - stage: Deploy_prd
    displayName: Deploy production (prd)
    condition: succeeded()
    jobs:
      - template: templates/deploy-environment.yml
        parameters:
          environment: prd
          devopsEnvironment: eim-wtc-prd
          serviceConnection: sc-eim-wtc-prd
          variableGroup: eim-wtc-prd
          packageSource: eim
          ownsResources: true
          deployInfra: ${{ parameters.deployInfra }}
          applySettings: ${{ parameters.applySettings }}
          runMigrations: ${{ parameters.runMigrations }}
          grantDatabaseAccess: ${{ parameters.grantDatabaseAccess }}
          ${{ if parameters.deployCode }}:
            components: gateway, backend, frontend, automation
