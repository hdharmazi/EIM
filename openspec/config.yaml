schema: spec-driven

# Project context, shown to AI when creating artifacts.
context: |
  Domain: integration hub moving customer, contact, party contact, address, and sales order data
  between Capture and Microsoft Dynamics 365 Finance and Supply Chain Management (D365 F&SC),
  with an operations dashboard for monitoring, holding, releasing, and reprocessing messages.
  Tech stack: .NET 10, Azure Functions isolated worker (Wilson.Integration.Automation, D365FSC.Gateway),
  Azure Service Bus, Azure SQL (eimdb, DbUp migrations), ASP.NET Core Dashboard API,
  React 18 + Vite + TypeScript + Tailwind/Radix dashboard frontend, xUnit tests.
  Orchestrations are named <Entity>_To_<Target> and registered in OrchestrationRegistry.
  Environments: local (local SQL eimdb, Azurite, dev-* queues), bat, test. Dashboard and Gateway are shared nonprod deployments.
  See CLAUDE.md for conventions and pitfalls.

# Per-artifact rules
rules:
  proposal:
    - Include the work item / ticket number when one is given
    - Always include a "Non-goals" section
  design:
    - Describe failure behaviour (terminal vs transient, retries, idempotency) for any message-processing change
    - Call out schema migrations and whether they are compatible with the currently deployed code
  tasks:
    - Each task names the files it touches and the test that proves it
    - Group tasks as Implementation, Tests, and (when needed) Deploy and verify
    - Include a final task to run the affected dotnet test projects
