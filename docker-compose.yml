services:
  dashboard-api:
    image: arm-integration-dashboard-api
    build:
      context: .
      dockerfile: ARM.Integration.Dashboard.API/Dockerfile
    ports:
      - "5060:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=8080
      - ConnectionStrings__EIMDB=${EIMDB_CONNECTION_STRING}
      - ApiKey=${DASHBOARD_API_KEY}

  dashboard-frontend:
    image: arm-integration-dashboard-frontend
    build:
      context: ARM.Integration.Dashboard.Frontend
      dockerfile: Dockerfile
      args:
        - VITE_ENTRA_TENANT_ID=${VITE_ENTRA_TENANT_ID}
        - VITE_ENTRA_CLIENT_ID=${VITE_ENTRA_CLIENT_ID}
        - VITE_API_SCOPE=${VITE_API_SCOPE}
    ports:
      - "5059:8080"
    environment:
      - API_UPSTREAM=http://dashboard-api:8080
    depends_on:
      - dashboard-api
